name: Compile MEX Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-13
            label: macOS-Intel
          - os: macos-latest
            label: macOS-AppleSilicon

    runs-on: ${{ matrix.os }}
    name: MEX — ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free MATLAB CI works on PUBLIC repos — no licence needed.
      # Change `release` to match your MATLAB version (run `version` in MATLAB).
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
          products: MATLAB_Compiler

      # mcc -W mex bundles rk4.m + entire call tree into one MEX binary.
      - name: Compile
        uses: matlab-actions/run-matlab-command@v2
        with:
          command: |
            addpath(pwd);
            mcc('-W', 'mex:rk4_mex_p0q1r0', '-v', '-d', '.', 'rk4.m');
            d = dir('rk4_mex_p0q1r0.*');
            assert(~isempty(d), 'MEX binary not produced.');
            fprintf('Built: %s\n', d(1).name);

      - name: Verify
        shell: bash
        run: ls -lh rk4_mex_p0q1r0.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mex-${{ matrix.label }}
          path: rk4_mex_p0q1r0.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: mex-binaries
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mex-latest
          name: "MEX Binaries — latest build"
          body: |
            ## Pre-compiled MEX binaries

            Download the one file for your platform, place it in the same
            folder as main.m, then follow the README instructions.

            | File | Platform |
            |------|----------|
            | rk4_mex_p0q1r0.mexa64    | Linux 64-bit |
            | rk4_mex_p0q1r0.mexw64    | Windows 64-bit |
            | rk4_mex_p0q1r0.mexmaci64 | macOS Intel (pre-2021 Mac) |
            | rk4_mex_p0q1r0.mexmaca64 | macOS Apple Silicon (M1/M2/M3) |

            Built from commit: ${{ github.sha }}
          files: mex-binaries/*
          make_latest: true
